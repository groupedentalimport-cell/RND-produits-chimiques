# ============================================================
# ChemStab — GitHub Actions CI/CD Pipeline
# ============================================================
#
# Triggers:
#   - Push to main branch → Build + Deploy to production
#   - Pull request to main → Build + Lint check only
#
# Deployment target: VPS via SSH (self-hosted runner or SSH deploy)
#
# Environment secrets required (Settings → Secrets → Actions):
#   - DEPLOY_HOST       — Target server IP/domain
#   - DEPLOY_USER       — SSH username (e.g., root or deploy)
#   - DEPLOY_SSH_KEY    — Private SSH key for connecting
#   - DEPLOY_PORT       — SSH port (default 22)
#   - NEXTAUTH_SECRET   — Production NextAuth secret
#   - POSTGRES_PASSWORD — PostgreSQL password
#
# ============================================================

name: ChemStab CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  BUN_VERSION: "1"

jobs:
  # ── Lint & Build Check ──────────────────────────────────────────
  lint-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run ESLint
        run: bun run lint

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:./db/test.db"

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: chemstab-standalone
          path: .next/standalone/
          retention-days: 1

  # ── Deploy to Production ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: lint-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_SCRIPT'
            set -e
            
            echo "=== ChemStab Production Deploy ==="
            
            # Navigate to project directory
            cd /opt/chemstab || {
              echo "Creating /opt/chemstab directory..."
              mkdir -p /opt/chemstab
              cd /opt/chemstab
            }
            
            # Pull latest code
            git pull origin main || echo "Git pull failed - may be first deploy"
            
            # Update environment variables
            if [ ! -f .env.production ]; then
              cp .env.example .env.production
            fi
            
            # Build and start services
            docker compose up -d --build
            
            # Wait for services
            echo "Waiting for services to start..."
            sleep 30
            
            # Check health
            docker compose ps
            
            echo "=== Deploy complete ==="
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          sleep 15
          curl -f http://${{ secrets.DEPLOY_HOST }}:81/ || echo "Warning: App not responding yet"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
